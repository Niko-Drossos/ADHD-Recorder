    # No ports published: only the ingest service talks to it.

  ingest:
    build: ./ingest
    container_name: recall-ingest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_URL}:5432/${POSTGRES_DB}
      INGEST_TOKEN: ${INGEST_TOKEN}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE-en}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.1.110:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      KEEP_AUDIO_DAYS: ${KEEP_AUDIO_DAYS:-3}
      AUDIO_DIR: /audio
    volumes:
      - ./data/audio:/audio
      - ./data/models:/models
    ports:
      # Bind to the Tailscale interface only, not 0.0.0.0.
      # Replace BIND_ADDR in .env with your host's Tailscale IP.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"
